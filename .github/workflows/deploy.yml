# Build and publish ASGRA Mesin 2 to GitHub Pages with GitHub Actions.
# No Vercel anywhere. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; only the newest queued run replaces it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reports the site's base path and host (handles /<repo>/, user sites
      # and custom domains). Fails with a clear message if Pages isn't enabled.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_PUBLIC_HOSTNAME: ${{ steps.pages.outputs.host }}

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -f dist/.nojekyll
          test -s dist/__grok/manifest.webmanifest
          ls dist/assets | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
